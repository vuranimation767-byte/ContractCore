# ContractCore configuration.
# contract ids must be lowercase and may only contain a-z, 0-9, _ and -.
# reward 'exp' values are experience levels (the number on the XP bar).
settings:
  # How many contracts a player may have active at the same time.
  max-active-contracts: 3
  # How often dirty player data is written to the database, in seconds.
  autosave-seconds: 20

contracts:
  - id: stone-digger
    name: "Stone Digger"
    description: "Break 64 stone blocks."
    objective:
      type: BREAK_BLOCK
      target: STONE
      amount: 64
    difficulty: EASY
    enabled: true
    repeatable: false
    reward:
      exp: 150

  - id: lumberjack
    name: "Lumberjack"
    description: "Chop and collect 128 oak logs."
    objective:
